# Deployment to Azure staging (T1.19).
# Runs after the CI workflow succeeds for a push to main, so only code that passed
# lint, tests, build and the secret scan is deployed. It can also be started by hand.
# Azure sign-in uses OpenID Connect: GitHub proves its identity to Microsoft Entra ID
# at run time, so no Azure password or publish profile is stored in GitHub.
name: Deploy to staging

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; a newer run waits instead of cancelling a deployment halfway.
concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy client and API
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The staging environment only accepts deployments from main, and the Azure
    # identity only trusts tokens issued for this environment.
    environment:
      name: staging
      url: https://blue-plant-05f65f500.4.azurestaticapps.net
    permissions:
      contents: read
      id-token: write # needed to request the OpenID Connect token for Azure sign-in

    steps:
      - name: Check out the commit that passed CI
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - name: Set up Node.js (version from .nvmrc)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build client
        run: npm run build

      # The client calls /api on its own site; Static Web Apps forwards it to the linked App Service.
      - name: Deploy client to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@1a947af9992250f3bc2e68ad0754c0b0c11566c9 # v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: client/dist
          output_location: ''
          skip_app_build: true
          skip_api_build: true

      # Production dependencies of the API only (no client or test packages).
      - name: Package API
        run: |
          npm ci --omit=dev --workspace server --include-workspace-root=false
          mkdir -p api-package
          cp -r server/src server/package.json api-package/
          cp -r node_modules api-package/
          rm -f api-package/node_modules/kk-factor-server api-package/node_modules/kk-factor-client
          cd api-package && zip -qr ../api.zip .

      - name: Sign in to Azure (OpenID Connect)
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy API to Azure App Service
        uses: azure/webapps-deploy@02a81bead70021f5284939794bcec79c271ab383 # v3.0.8
        with:
          app-name: kkfactor-api-stg-32326
          package: api.zip

      # Smoke test through the static web app, the same path a browser uses.
      - name: Check the deployed site over HTTPS
        env:
          SITE: https://blue-plant-05f65f500.4.azurestaticapps.net
        run: |
          curl -sSf -o /dev/null "$SITE/"
          for attempt in $(seq 1 18); do
            body=$(curl -sS "$SITE/api/health" || true)
            echo "Attempt $attempt: $body"
            if echo "$body" | grep -q '"database":"connected"'; then
              exit 0
            fi
            sleep 10
          done
          echo "The API did not report a database connection within 3 minutes."
          exit 1
